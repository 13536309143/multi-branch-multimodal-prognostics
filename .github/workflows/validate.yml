name: Validate data and model contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU environment
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-verified.txt
          python -m pip install -e . --no-deps
      - name: Download pinned data and verify all raw files
        run: python scripts/download_dataset.py
      - name: Essential data, model, metric and workflow checks
        run: python -m pytest -q checks
      - name: Check CPU execution
        run: python scripts/verify_environment.py
